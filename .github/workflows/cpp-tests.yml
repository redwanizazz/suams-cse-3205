name: C++ Course Registration Tests

on:
  push:
    branches:
      - main
      - feature/course-registration

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install compiler and GoogleTest
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake libgtest-dev

      - name: Compile tests
        run: |
          g++ -std=c++17 \
          suams-testing/course_registration.cpp \
          suams-testing/course_registration_test.cpp \
          -lgtest \
          -pthread \
          -o course_registration_tests

      - name: Run tests
        run: |
          ./course_registration_tests